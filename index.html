<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Mini jeu</title>
</head>
<body>
    <div class="container mt-5">
        <div class="text-warning mb-4">
            <p class="mb-1">Score: <span id="score">0</span></p>
            <p id="txtLvl" class="mb-1">Niveau: <span id="niveau">0</span></p>
            <div class="d-flex justify-content-between align-items-center">
                <p id="txtEff" class="mb-0">efficience: <span id="efficience">x1</span></p>
                <button id="boost" class="btn btn-success">boost</button>
            </div>
        </div>

        <div class="text-center mt-5">
            <button id="mon-bouton" class="btn btn-primary px-4">Cliquez ici</button><br>
            <button id="level-up" class="btn btn-danger mt-3">Niveau supérieur</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
